name: salary_brother
description: "Salary Brother - salary advance and personal loan app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # state management + routing
  get: ^4.6.6

  # networking
  dio: ^5.4.2+1
  connectivity_plus: ^6.1.4

  # storage
  shared_preferences: ^2.2.3

  # ui helpers
  responsive_sizer: ^3.1.1
  fluttertoast: ^8.2.5
  pin_code_fields: ^8.0.1
  another_stepper: ^1.2.2
  simple_circular_progress_bar: ^1.0.2

  # device / platform
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  image_picker: ^1.1.1

  # typography
  google_fonts: ^6.2.1

  # utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
